<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navy Data Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="navy-icon" aria-hidden="true">⚓</div>
            <h1>Navy Data Search</h1>
        </header>

        <div class="search-container">
            <label for="search-input">Search Query</label>
            <input type="text" id="search-input" placeholder="Search for Navy information..." aria-label="Search Query">
            
            <label for="category-filter">Filter by Category</label>
            <select id="category-filter" aria-label="Category Filter">
                <option value="">All Categories</option>
                <!-- Categories will be populated dynamically -->
            </select>
            
            <button id="search-button" aria-label="Search Button">Search</button>
        </div>

        <div class="loading" aria-live="polite">
            <div class="loading-spinner" role="status" aria-label="Loading"></div>
            <p>Searching...</p>
        </div>

        <div class="results" id="results-container" aria-live="polite">
            <div class="message">Enter a search query to find Navy information</div>
        </div>
    </div>

    <div id="detail-modal" class="modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-content">
            <button class="close" aria-label="Close Modal">&times;</button>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="result-category" id="modal-category"></div>
            <div class="result-path" id="modal-path"></div>
            <pre id="modal-content"></pre>
        </div>
    </div>

    <script>
        // Config
        const MCP_SERVER_URL = 'http://localhost:3000';  // Update with your actual MCP server URL

        // DOM elements
        const searchInput = document.getElementById('search-input');
        const categoryFilter = document.getElementById('category-filter');
        const searchButton = document.getElementById('search-button');
        const resultsContainer = document.getElementById('results-container');
        const loadingIndicator = document.querySelector('.loading');
        const modal = document.getElementById('detail-modal');
        const modalClose = document.querySelector('.close');
        const modalTitle = document.getElementById('modal-title');
        const modalCategory = document.getElementById('modal-category');
        const modalPath = document.getElementById('modal-path');
        const modalContent = document.getElementById('modal-content');

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Load categories for filter dropdown
            await loadCategories();
            
            // Set up event listeners
            searchButton.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
            modalClose.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });

        // Load categories from MCP server
        async function loadCategories() {
            try {
                const response = await fetch(`${MCP_SERVER_URL}/function/getCategories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load categories');
                }
                
                const data = await response.json();
                const categories = data.result;
                
                // Populate category filter dropdown
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                    categoryFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
                // Add a default set of categories in case of error
                const defaultCategories = ['aircraft', 'bases', 'carriers', 'destroyers', 'fleets'];
                defaultCategories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                    categoryFilter.appendChild(option);
                });
            }
        }

        // Perform search using MCP server
        async function performSearch() {
            const query = searchInput.value.trim();
            const category = categoryFilter.value;
            
            if (!query) {
                resultsContainer.innerHTML = '<div class="message">Please enter a search query</div>';
                return;
            }
            
            // Show loading indicator
            loadingIndicator.style.display = 'block';
            resultsContainer.innerHTML = '';
            
            try {
                const response = await fetch(`${MCP_SERVER_URL}/function/searchNavyData`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        category: category || undefined,
                        limit: 10
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Search request failed');
                }
                
                const data = await response.json();
                const results = data.result;
                
                // Display results
                displayResults(results);
            } catch (error) {
                console.error('Search error:', error);
                resultsContainer.innerHTML = '<div class="message">An error occurred while searching. Please try again.</div>';
            } finally {
                // Hide loading indicator
                loadingIndicator.style.display = 'none';
            }
        }

        // Display search results
        function displayResults(results) {
            if (!results || results.length === 0) {
                resultsContainer.innerHTML = '<div class="message">No results found</div>';
                return;
            }
            
            resultsContainer.innerHTML = '';
            
            results.forEach(result => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                
                // Truncate content if needed
                const truncatedContent = result.content.length > 500 
                    ? result.content.substring(0, 500) + '...' 
                    : result.content;
                
                // Format path for display
                const displayPath = result.path.replace(/\.md$/, '');
                
                resultItem.innerHTML = `
                    <h3 class="result-title">${escapeHtml(result.title)}</h3>
                    <div class="result-category">${escapeHtml(result.category)}</div>
                    <button class="view-details" data-id="${escapeHtml(result.id)}">View Details</button>
                    <div class="result-path">${escapeHtml(displayPath)}</div>
                    <div class="result-content">${escapeHtml(truncatedContent)}</div>
                `;
                
                resultsContainer.appendChild(resultItem);
                
                // Add event listener to view details button
                const detailsButton = resultItem.querySelector('.view-details');
                detailsButton.addEventListener('click', () => viewDetails(result.id));
            });
        }

        // View document details
        async function viewDetails(id) {
            try {
                const response = await fetch(`${MCP_SERVER_URL}/function/getDocumentById`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: id
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load document details');
                }
                
                const data = await response.json();
                const document = data.result;
                
                // Populate modal with document details
                modalTitle.textContent = document.title;
                modalCategory.textContent = document.category;
                modalPath.textContent = document.path;
                modalContent.textContent = document.content;
                
                // Show modal
                modal.style.display = 'block';
            } catch (error) {
                console.error('Error loading document details:', error);
                alert('Failed to load document details. Please try again.');
            }
        }

        // Helper function to escape HTML
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
